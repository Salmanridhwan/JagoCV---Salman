    <style>
      body { font-family: 'Inter', sans-serif; }
      
      .hide-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(calc(-50% - 1rem)); } /* -50% shifts slightly past half because of the gap, if gap is 2rem (gap-8), we subtract half the gap, which is 1rem */
      }
      .animate-marquee {
        animation: marquee 40s linear infinite;
      }
      
      /* Dark Blue Atmospheric Background */
      .bg-atmospheric {
        background-image: 
          radial-gradient(ellipse 100% 60% at 50% -20%, rgba(37, 99, 235, 0.15), transparent),
          radial-gradient(ellipse 80% 50% at 50% 120%, rgba(30, 58, 138, 0.15), transparent);
        background-attachment: fixed;
      }
      
      .light-atmospheric {
        background-image: 
          radial-gradient(ellipse 100% 60% at 50% -20%, rgba(186, 230, 253, 0.4), transparent),
          radial-gradient(ellipse 80% 50% at 50% 120%, rgba(219, 234, 254, 0.4), transparent);
        background-attachment: fixed;
      }


      /* Dashboard Glass Cards */
      .dash-card {
        background: #ffffff;
        border: 1px solid rgba(203, 213, 225, 0.8);
        box-shadow: 0 10px 40px -10px rgba(0,0,0,0.06);
        transition: all 0.2s ease-in-out;
      }
      .dark .dash-card {
        background: rgba(11, 18, 33, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(30, 41, 59, 0.8);
        box-shadow: none;
      }
      .dash-card:hover {
        border-color: rgba(59, 130, 246, 0.3);
        box-shadow: 0 10px 30px -10px rgba(37, 99, 235, 0.15);
        transform: translateY(-2px);
      }
      .dark .dash-card:hover {
        border-color: rgba(59, 130, 246, 0.4);
        box-shadow: 0 10px 30px -10px rgba(37, 99, 235, 0.15);
      }

      @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </head>
