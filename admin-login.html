<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Admin — jagoCV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/index.css">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f6f7f9] text-slate-700 min-h-screen antialiased flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="flex items-center gap-3 mb-8">
      <div class="w-12 h-12 rounded-2xl bg-slate-900 flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM12 12l8-4.5M12 12v9m0-9L4 7.5"></path></svg>
      </div>
      <div>
        <div class="font-extrabold text-slate-900 text-lg leading-tight">JagoCV</div>
        <div class="text-[11px] tracking-[0.18em] text-slate-500 font-semibold">ADMIN CENTER</div>
      </div>
    </div>

    <h1 class="text-2xl font-extrabold text-slate-900 mb-1">Masuk Admin jagoCV</h1>
    <p class="text-sm text-slate-500 mb-6">Akun admin internal — bukan akun pengguna jagoCV.</p>

    <form id="admin-login-form" class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
      <div>
        <label for="admin-email" class="block text-xs font-semibold text-slate-600 mb-1.5">Email admin</label>
        <input id="admin-email" type="email" required autocomplete="email"
               class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-400"
               placeholder="admin@jagocv.local">
      </div>
      <div>
        <label for="admin-password" class="block text-xs font-semibold text-slate-600 mb-1.5">Password</label>
        <input id="admin-password" type="password" required autocomplete="current-password"
               class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-400"
               placeholder="••••••••">
      </div>
      <p id="admin-login-error" class="hidden text-xs font-medium text-rose-600 bg-rose-50 border border-rose-100 rounded-lg px-3 py-2"></p>
      <button id="admin-login-submit" type="submit"
              class="w-full rounded-xl bg-slate-900 hover:bg-slate-800 disabled:opacity-60 text-white font-semibold text-sm py-2.5 transition-colors">
        Masuk
      </button>
    </form>

    <p class="text-[11px] text-slate-400 mt-4">Bukan halaman pengguna? <a href="/index.html" class="underline hover:text-slate-600">Kembali ke aplikasi jagoCV</a></p>
  </div>

  <script type="module" src="/src/admin/login.ts"></script>
</body></html>
